server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Auth Service Routes
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v2/auth/**

        # Core Banking & Double-Entry Ledger Routes
        - id: core-banking-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/banking/**, /api/v2/banking/**

        # AML & Regulatory Compliance Routes (Dual format XML/JSON)
        - id: aml-compliance-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/compliance/**, /api/v1/work-items/**

        # Order & Payment Service Routes (Idempotent payments)
        - id: order-payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/payments/**, /api/v1/orders/**

        # B2B Pricing Engine Routes
        - id: pricing-engine-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/pricing/**

        # Batch Settlement & Reconciliation Triggers
        - id: batch-services
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/reconciliation/**, /api/v1/settlements/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
