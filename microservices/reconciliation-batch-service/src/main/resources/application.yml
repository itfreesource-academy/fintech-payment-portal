server:
  port: 8086

spring:
  application:
    name: reconciliation-batch-service
  datasource:
    url: jdbc:postgresql://localhost:5432/reconciliation_db
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  data:
    mongodb:
      uri: mongodb://localhost:27017/reconciliation_source

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
